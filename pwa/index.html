<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS Safari does not reliably honour manifest.json's display:"standalone"
         on its own (especially on older iOS versions): without these, "Add to
         Home Screen" can still launch inside Safari's own UI (address bar,
         tabs) instead of as a full-screen app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FecalVision" />
    <meta
      name="description"
      content="On-device screening of chicken droppings for signs of common poultry diseases. Works offline; photos never leave your phone."
    />
    <title>FecalVision</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
